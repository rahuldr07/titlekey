:root{
--canvas:#F6F7F9;--surface:#FFF;--surface2:#FBFBFC;--ink:#0F1115;--ink2:#3F444D;--mut:#697077;--faint:#9AA1A9;
--line:#E7E9EC;--line2:#EFF1F3;--brand:#6E56CF;--brand2:#5B45B8;--brandsoft:#F1EEFB;--brandline:#DCD4F7;
--ok:#189A64;--oksoft:#E6F6EE;--okline:#BEE7D2;--warn:#B45309;--warnsoft:#FDF3E4;--warnline:#F3DDB4;
--bad:#D4382C;--badsoft:#FDEDEB;--badline:#F6CCC7;--info:#2563EB;--infosoft:#EBF1FE;
--sh1:0 1px 2px rgb(15 17 21/.05);--sh2:0 1px 2px rgb(15 17 21/.04),0 8px 24px -8px rgb(15 17 21/.10);
--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--canvas);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-.006em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left;letter-spacing:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:0}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.mut{color:var(--mut)}.faint{color:var(--faint)}.br{color:var(--brand2)}

/* top bar: brand + role switcher */
.top{height:62px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 18px;position:sticky;top:0;z-index:50}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.02em}
.logo i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#8A74E8,var(--brand2));position:relative;box-shadow:inset 0 1px 0 rgb(255 255 255/.35)}
.logo i::after{content:'';position:absolute;inset:7px;border-radius:3px;background:#fff;opacity:.92}
.roles{margin-left:auto;display:flex;background:var(--canvas);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.roles button{font-size:13px;font-weight:600;color:var(--mut);padding:7px 14px;border-radius:7px;white-space:nowrap}
.roles button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh1);border:1px solid var(--line2);padding:6px 13px}
.acct{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--mut)}

/* layout */
.lay{display:flex;min-height:calc(100vh - 62px)}
.side{width:238px;flex:none;background:linear-gradient(180deg,#161129,#1D1535 60%,#211840);border-right:1px solid rgb(255 255 255/.06);padding:16px 12px;position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto}
.side .srch{background:rgb(255 255 255/.06);border-color:rgb(255 255 255/.10);color:#8E87A6}
.side .srch kbd{background:rgb(255 255 255/.08);border-color:rgb(255 255 255/.12);color:#8E87A6;box-shadow:none}
.side .ngrp{color:#6E6787}
.side .nit{color:#B9B3CC;font-weight:500}
.side .nit:hover{background:rgb(255 255 255/.06)}
.side .nit.on{background:rgb(138 116 232/.18);color:#D9D0FA;font-weight:600;box-shadow:inset 0 0 0 1px rgb(138 116 232/.28)}
.side .nit .ct{color:#6E6787}
.srch{display:flex;align-items:center;gap:8px;background:var(--canvas);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--faint);font-size:13.5px;margin:0 4px 10px}
.srch kbd{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--mut);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.ngrp{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:12px 12px 5px}
.nit{display:flex;align-items:center;gap:11px;width:100%;padding:9px 13px;border-radius:10px;font-size:14.5px;font-weight:500;color:var(--ink2)}
.nit:hover{background:var(--surface2)}
.nit.on{background:var(--brandsoft);color:var(--brand2);font-weight:600}
.nit .ct{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.nit .ct.hot{color:#fff;background:var(--bad);border-radius:99px;padding:0 6px;line-height:16px;font-weight:600;font-family:Inter}
.main{flex:1;min-width:0;padding:30px 40px 60px;max-width:1200px;background:radial-gradient(900px 340px at 12% -8%,rgb(110 86 207/.055),transparent 70%)}

/* page head */
.crumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);margin-bottom:10px}
.crumb b{color:var(--ink)}
.phead{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:14px}
h1{font-size:31px;font-weight:700;letter-spacing:-.032em}
.psub{color:var(--mut);font-size:14.5px;margin-top:5px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;padding:10px 17px;border-radius:11px;white-space:nowrap;border:1px solid transparent}
.btn.pri{background:var(--brand);color:#fff;box-shadow:inset 0 1px 0 rgb(255 255 255/.18),0 1px 2px rgb(110 86 207/.4)}
.btn.dark{background:var(--ink);color:#fff}
.btn.sec{background:var(--surface);border-color:var(--line);box-shadow:var(--sh1)}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn.full{width:100%;justify-content:center}
.btn:disabled{opacity:.45}

/* KPI row */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpis.k3{grid-template-columns:repeat(3,1fr)}
.kpi{border-radius:18px;padding:18px 20px;box-shadow:var(--sh1);border:1px solid}
.kpi:nth-child(1){background:linear-gradient(160deg,#F5F1FF,#ECE5FC);border-color:#DCD4F7}
.kpi:nth-child(2){background:linear-gradient(160deg,#EDFAF2,#DFF4E8);border-color:#BEE7D2}
.kpi:nth-child(3){background:linear-gradient(160deg,#FDF6E9,#FAEDD3);border-color:#F3DDB4}
.kpi:nth-child(4){background:linear-gradient(160deg,#EEF4FE,#E1ECFC);border-color:#C9DBF8}
.kpi:nth-child(1) .l{color:#5B45B8}.kpi:nth-child(2) .l{color:#187A52}.kpi:nth-child(3) .l{color:#96570C}.kpi:nth-child(4) .l{color:#1D53BE}

const who=(i,h,n)=>`<span class="who">${av(i,h)}${n}</span>`;
const prg=(d,t,mode)=>{const w=t?Math.round(d/t*100):0;
 return`<span class="prg"><span class="tk"><span class="fl ${mode||''}" style="width:${mode==='p'?40:w}%"></span></span><span class="pc">${mode==='p'?'paused':d===t?'✓':d+'/'+t}</span></span>`};
const kpis=a=>`<div class="kpis${a.length===3?' k3':''}">`+a.map(k=>`<div class="kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}${k[2]?`<small> ${k[2]}</small>`:''}</div>${k[3]?`<div class="t ${k[4]||''}">${k[3]}</div>`:''}</div>`).join('')+`</div>`;
const bnr=(tone,icon,title,body,meta,acts)=>`<div class="attn ${tone}"><span class="ic">${icon}</span><div><b>${title}</b><p>${body}</p></div>${meta?`<div class="meta">${meta}</div>`:''}${acts?`<div class="acts">${acts}</div>`:''}</div>`;
const btn=(t,cls,go)=>`<button class="btn ${cls||'sec'}"${go?` onclick="nav('${go}')"`:''}>${t}</button>`;
const phead=(t,sub,right)=>`<div class="phead"><div><h1>${t}</h1>${sub?`<div class="psub">${sub}</div>`:''}</div>${right?`<div style="display:flex;gap:9px">${right}</div>`:''}</div>`;
const crumb=(a,b,goA)=>`<div class="crumb"><button onclick="nav('${goA}')" style="color:var(--mut)" onmouseover="this.style.color='var(--ink)'" onmouseout="this.style.color='var(--mut)'">${a}</button><span>›</span><b>${b}</b></div>`;

function table(o){
 let pillsHtml='';
 if(o.pills){
  pillsHtml='<div class="filters">';
  for(const p of o.pills){
   const on=(PILLS[o.id]||o.pills[0].k)===p.k;
   pillsHtml+='<button class="ftab'+(on?' on':'')+(p.hot?' hot':'')+'" onclick="PILLS[\''+o.id+'\']=\''+p.k+'\';paint()">'+p.l+' <em>'+p.n+'</em></button>';
  }
  let fr='';
  if(o.range)fr+='<span style="font-size:12px;font-weight:600;color:var(--ink2);margin-right:2px">Ordered within</span>'+
   '<span class="mini" style="font-weight:600;color:var(--ink)">'+(SEL[o.id+':range']||o.range[0])+' <span class="faint">▾</span></span>';
  if(o.search)fr+='<span class="mini">⌕ '+o.search+'</span>';
  pillsHtml+='<div class="fright" style="align-items:center">'+fr+'</div></div>';
 }
 const head='<tr>'+o.cols.map(c=>'<th'+((c&&c.num)?' class="num"':'')+'>'+((c&&c.l!==undefined)?c.l:c)+'</th>').join('')+'</tr>';
 const body=o.rows.map(r=>{
  const cells=(r.c||r).map((v,i)=>{const col=o.cols[i]||{};return '<td'+(col.num?' class="num"':'')+'>'+v+'</td>'}).join('');
  return '<tr class="rw'+(r.hl?' hl':'')+'"'+(r.go?' onclick="nav(\''+r.go+'\')"':'')+'>'+cells+'</tr>'}).join('');
 let foot='';
 if(o.foot)foot='<div class="tfoot"><span>'+o.foot[0]+'</span><span class="mono" style="font-size:11px">'+(o.foot[1]||'')+'</span></div>';
 return '<div class="card">'+pillsHtml+'<table><thead>'+head+'</thead><tbody>'+body+'</tbody></table>'+foot+'</div>'}
const card=(inner,cls)=>`<div class="card ${cls||''}"><div class="pad">${inner}</div></div>`;
const h3=(t,r)=>`<h3>${t}${r?`<span class="r">${r}</span>`:''}</h3>`;
const kv=rows=>`<div class="kv">${rows.map(r=>`<span class="k">${r[0]}</span><span class="v${r[2]?' mono':''}" ${r[2]?'style="font-size:12px"':''}>${r[1]}</span>`).join('')}</div>`;
const kv2=rows=>`<div class="kv2">${rows.map(r=>`<span class="k" ${r[2]?'style="border-top:1px solid var(--line2);padding-top:8px;font-weight:600;color:var(--ink)"':''}>${r[0]}</span><span class="mono" style="font-weight:${r[2]?700:500};text-align:right;${r[2]?'border-top:1px solid var(--line2);padding-top:8px':''}">${r[1]}</span>`).join('')}</div>`;
const steps=a=>`<div class="steps">${a.map(s=>`<div class="st${s.s==='dn'?' g':''}"><div class="rl"><span class="dt ${s.s}">${s.s==='dn'?'✓':s.s==='nw'?'●':''}</span></div><div style="flex:1"><div class="bt${s.s==='td'?' m':''}">${s.t}</div><div class="bs">${s.d}</div></div>${s.w?`<span class="tm">${s.w}</span>`:''}</div>`).join('')}</div>`;
const STAGES=['Upload','Gap check','Package QC','Typing','Field review','Delivered'];
const pipe=(at,blocked)=>`<div class="pipe">${STAGES.map((s,i)=>{
 const st=i<at?'dn':i===at?(blocked?'bl':'nw'):'';
 return`<span class="pp ${st?st+'T':''}"><span class="pd ${st}"></span>${s}</span>${i<STAGES.length-1?`<span class="pl2 ${i<at?'dn':''}"></span>`:''}`}).join('')}</div>`;
const seg=(opts,onIdx)=>`<span class="seg">${opts.map((o,i)=>`<button class="${i===(onIdx||0)?'on':''}">${o}</button>`).join('')}</span>`;
const noteBox=(tone,html)=>`<div class="note ${tone}">${html}</div>`;
const eng=(tg,val,name,det,diff)=>{
 let v=val;if(diff)v=esc(val.slice(0,diff[0]))+`<span class="df">${esc(val.slice(diff[0],diff[1]))}</span>`+esc(val.slice(diff[1]));else v=esc(val);

const upBox=(t,s)=>`<div class="upbox"><b>${t}</b>${s}</div>`;

let role='client',view='c-orders';
function nav(id){if(!S[id])return;view=id;
 // switch role automatically if screen belongs to another role
 const pfx={c:'client',v:'vendor',i:'internal',a:'admin',r:'reports',u:'user'}[id[0]];
 if(pfx&&pfx!==role)role=pfx;
 paint()}
function go(id){nav(id)}
function setRole(r){role=r;view=ROLES[r].groups[0].t[0][1];for(const k in PILLS)delete PILLS[k];paint()}
function paint(){
 const R=ROLES[role];
 document.getElementById('roles').innerHTML=Object.entries(ROLES).map(([k,r])=>`<button class="${k===role?'on':''}" onclick="setRole('${k}')">${r.label}</button>`).join('');

 document.getElementById('acct').innerHTML=`${av(R.ini,R.hue)}<span><b style="color:var(--ink);font-weight:600;font-size:12.5px">${R.who}</b> · ${R.co}</span>`;
 document.getElementById('nav').innerHTML=`<div class="srch">⌕ Search anything<kbd>⌘K</kbd></div>`+
  R.groups.map(g=>`<div class="ngrp">${g.l}</div>`+g.t.map(t=>{
   const on=view===t[1];const o=t[2]||{};
   return`<button class="nit${on?' on':''}" onclick="nav('${t[1]}')">${t[0]}${o.badge?`<span class="ct hot">${o.badge}</span>`:o.ct?`<span class="ct">${o.ct}</span>`:''}</button>`}).join('')).join('');
 document.getElementById('main').innerHTML=S[view]?S[view]():'';
 window.scrollTo(0,0)}

S['a-laws']=()=>phead('Product laws','Seventeen release blockers. Not preferences — a build that breaks one does not ship.')

 ['Never generate backend rules from UI behaviour or pixels','The interface renders the rulebook. It never becomes it.'],
 ['Never emit a value without provenance','Page and region on every extracted field. Missing provenance is a hard validation failure.'],
 ['Never collapse the NA states','Structurally-absent, not-found, not-stated and present-but-unreadable are four different facts.'],
 ['Never calculate needs_review in the browser','Routing is server-side and exact. Browser validation is cosmetic.'],
 ['Never auto-confirm judgments in v1','Every judgment routes to a human, regardless of agreement.'],
 ['Never use engine self-confidence as an auto-confirm gate','Agreement between independent readers, not a score.'],
 ['Never let one engine see another\'s output','Reader A, Reader B and the second opinion are independent or they are one engine.'],
 ['Never let a PENDING rule affect prompts, validation, routing, rendering or delivery','Authored is not confirmed.'],
 ['Never accept actor identity from a request body','signed_by comes from the session, never the payload.'],
 ['Never suppress a lien because a chain terminates','Only a verified release can. Chain termination is not extinguishment.'],
 ['Never derive consideration from transfer, excise or documentary tax','It is a purchase identifier, not a price.'],
 ['Never validate land + building against total','v99 stays empty. Mixed valuation bases are intentional.'],
 ['Never email report attachments containing NPI','Links to an authenticated surface, never the file.'],
 ['Never put county packages, seed databases or client documents in VCS','Synthetic party names only.'],
 ['Never expose throughput counters, reviewer rankings or probe visibility','Measurement of people is not a product surface.'],
 ['Never offer approve-all, auto-tuning or queue cherry-picking','Each removes the judgment the review exists for.'],
 ['Never build past an OPEN or CONFLICT rule that changes the affected output','Stop and get it ruled.']]
